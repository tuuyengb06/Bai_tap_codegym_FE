<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang web với Màu nền & Ảnh nền</title>
  <!-- Liên kết tới file CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tiêu đề h1 -->
  <h1>Chào mừng đến với trang web của tôi</h1>

  <!-- Đoạn văn p mô tả -->
  <p class="description">
    Đây là trang web thực hành cơ bản về thuộc tính màu nền (background-color) 
    và ảnh nền (background-image) trong CSS.
  </p>

  <!-- Khối div chứa nội dung quan trọng -->
  <div class="content-box">
    <h2>Nội dung quan trọng</h2>
    <p>Khối này được áp dụng hình ảnh làm nền và được căn giữa nội dung.</p>
  </div>

</body>
</html>
