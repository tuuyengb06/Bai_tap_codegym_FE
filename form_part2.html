<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 2: Form Đăng Ký Học Viên</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-group label.title-label {
            display: block;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 8px;
        }

        .field-group input[type="text"],
        .field-group input[type="email"],
        .field-group input[type="tel"],
        .field-group input[type="date"],
        .field-group select,
        .field-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .field-group input:focus,
        .field-group select:focus,
        .field-group textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .field-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .inline-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 5px;
        }

        .inline-group label {
            font-weight: normal;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .button-group button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-register {
            background-color: #28a745;
            color: #ffffff;
        }

        .btn-register:hover {
            opacity: 0.9;
        }

        .btn-clear {
            background-color: #dc3545;
            color: #ffffff;
        }

        .btn-clear:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>ĐĂNG KÝ HỌC VIÊN</h2>
        <form action="#" method="POST">

            <!-- Họ và tên -->
            <div class="field-group">
                <label class="title-label" for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ và tên" required>
            </div>

            <!-- Email -->
            <div class="field-group">
                <label class="title-label" for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="vídụ@gmail.com" required>
            </div>

            <!-- Số điện thoại -->
            <div class="field-group">
                <label class="title-label" for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <!-- Ngày sinh -->
            <div class="field-group">
                <label class="title-label" for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <!-- Giới tính -->
            <div class="field-group">
                <label class="title-label">Giới tính:</label>
                <div class="inline-group">
                    <label><input type="radio" name="gender" value="male" checked> Nam</label>
                    <label><input type="radio" name="gender" value="female"> Nữ</label>
                    <label><input type="radio" name="gender" value="other"> Khác</label>
                </div>
            </div>

            <!-- Địa chỉ -->
            <div class="field-group">
                <label class="title-label" for="address">Địa chỉ:</label>
                <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ cư trú"></textarea>
            </div>

            <!-- Khóa học -->
            <div class="field-group">
                <label class="title-label" for="course">Khóa học:</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>-- Chọn khóa học --</option>
                    <option value="html_css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <!-- Hình thức học -->
            <div class="field-group">
                <label class="title-label">Hình thức học:</label>
                <div class="inline-group">
                    <label><input type="radio" name="study_type" value="online" checked> Online</label>
                    <label><input type="radio" name="study_type" value="offline"> Offline</label>
                </div>
            </div>

            <!-- Sở thích -->
            <div class="field-group">
                <label class="title-label">Sở thích:</label>
                <div class="inline-group">
                    <label><input type="checkbox" name="hobby" value="coding"> Lập trình</label>
                    <label><input type="checkbox" name="hobby" value="gaming"> Chơi game</label>
                    <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                </div>
            </div>

            <!-- Ghi chú -->
            <div class="field-group">
                <label class="title-label" for="note">Ghi chú:</label>
                <textarea id="note" name="note" rows="3" placeholder="Ghi chú thêm (nếu có)"></textarea>
            </div>

            <!-- Nút chức năng -->
            <div class="button-group">
                <button type="submit" class="btn-register">Đăng ký</button>
                <button type="reset" class="btn-clear">Nhập lại</button>
            </div>

        </form>
    </div>

</body>
</html>
