<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }

        h1 {
            color: #333333;
        }

        table {
            width: 100%;
            max-width: 700px;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: #ffffff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Laptop Dell Inspiron</td>
            <td>15.000.000 đ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Điện thoại iPhone 15</td>
            <td>22.000.000 đ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Bàn phím cơ Logitech</td>
            <td>1.500.000 đ</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Chuột không dây Logitech</td>
            <td>500.000 đ</td>
            <td>25</td>
        </tr>
    </table>

</body>
</html>
