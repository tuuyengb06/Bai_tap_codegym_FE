<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }

        h1 {
            color: #333333;
        }

        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: #ffffff;
            font-weight: bold;
        }

        /* Căn trái nội dung cho cột Nội dung cuộc họp để dễ đọc */
        td:nth-child(3) {
            text-align: left;
        }

        tr:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table>
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        <tr>
            <!-- Sử dụng rowspan="2" để gộp 2 hàng cho Thứ Hai -->
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 10:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>14:00 - 16:30</td>
            <td>Họp triển khai dự án mới</td>
        </tr>
        <tr>
            <td>Thứ Ba</td>
            <!-- Sử dụng colspan="2" để gộp 2 cột Giờ và Nội dung khi có sự kiện đặc biệt -->
            <td colspan="2">Nghỉ mát toàn công ty (Cả ngày)</td>
        </tr>
        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>09:00 - 11:00</td>
            <td>Đánh giá tiến độ thiết kế UI/UX</td>
        </tr>
        <tr>
            <td>15:00 - 17:00</td>
            <td>Họp bàn chiến lược Marketing quý 4</td>
        </tr>
    </table>

</body>
</html>
